<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="胶片闪光表" />
  <meta name="theme-color" content="#F4F2ED" id="metaThemeColor" />
  <title>胶片闪光测光表 · 手动闪光计算器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111214'/%3E%3Cpath d='M36 8 18 36h12l-4 20 20-30H34z' fill='%23FF7A2F'/%3E%3C/svg%3E" />
  <style>
    /* 默认：普通模式（日间浅色纸感配色） */
    :root,
    html[data-theme="light"] {
      --bg: #F4F2ED;
      --header-bg: rgba(244, 242, 237, 0.92);
      --tab-bg: rgba(255, 255, 255, 0.94);
      --surface: #FFFFFF;
      --surface-2: #ECE8DF;
      --input-bg: #F7F5F0;
      --border: #DDD7CB;
      --border-2: #CEC7B8;
      --text: #18191C;
      --text-2: #363940;
      --text-sub: #60646E;
      --text-dim: #858992;
      --amber: #D95814;
      --amber-light: #C24808;
      --amber-ink: #FFFFFF;
      --amber-bg: rgba(217, 88, 20, 0.11);
      --amber-border: rgba(217, 88, 20, 0.34);
      --green: #118252;
      --green-bg: rgba(17, 130, 82, 0.11);
      --green-border: rgba(17, 130, 82, 0.28);
      --warn: #A86C00;
      --warn-text: #8F5A00;
      --warn-bg: rgba(184, 122, 0, 0.11);
      --warn-border: rgba(184, 122, 0, 0.30);
      --danger: #D13434;
      --danger-bg: rgba(209, 52, 52, 0.10);
      --meter-bg: linear-gradient(160deg, #FFFFFF 0%, #F7F4EC 100%);
      --meter-border: #D5CFC2;
      --meter-shadow: 0 8px 22px rgba(24, 25, 28, 0.06);
      --meter-value: #18191C;
      --meter-sub-bg: rgba(236, 232, 223, 0.65);
      --meter-sub-border: #DDD7CB;
      --track-bg: #E8E3D9;
      --track-border: #D2CCC0;
      --zone-bg: linear-gradient(180deg, rgba(217, 88, 20, 0.36), rgba(217, 88, 20, 0.14));
      --zone-border: rgba(217, 88, 20, 0.65);
      --pin-color: #18191C;
      --pin-shadow: 0 0 0 1px rgba(255, 255, 255, 0.85), 0 0 6px rgba(0, 0, 0, 0.28);
      --toast-bg: rgba(24, 25, 28, 0.92);
      --toast-text: #FFFFFF;
      --mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    }

    /* 暗色模式（深灰橙暗房配色） */
    html[data-theme="dark"] {
      --bg: #111214;
      --header-bg: rgba(17, 18, 20, 0.92);
      --tab-bg: rgba(21, 23, 27, 0.94);
      --surface: #1A1C20;
      --surface-2: #23262C;
      --input-bg: #131518;
      --border: #2A2D34;
      --border-2: #32363F;
      --text: #F2F4F8;
      --text-2: #E3E7EF;
      --text-sub: #8A8F98;
      --text-dim: #666C76;
      --amber: #FF7A2F;
      --amber-light: #FF9457;
      --amber-ink: #111214;
      --amber-bg: rgba(255, 122, 47, 0.16);
      --amber-border: rgba(255, 122, 47, 0.38);
      --green: #3DDC97;
      --green-bg: rgba(61, 220, 151, 0.14);
      --green-border: rgba(61, 220, 151, 0.34);
      --warn: #F4B942;
      --warn-text: #F5C96B;
      --warn-bg: rgba(244, 185, 66, 0.13);
      --warn-border: rgba(244, 185, 66, 0.35);
      --danger: #FF7A7A;
      --danger-bg: rgba(255, 92, 92, 0.13);
      --meter-bg: linear-gradient(160deg, #1F2229 0%, #15171B 100%);
      --meter-border: #343842;
      --meter-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      --meter-value: #FFFFFF;
      --meter-sub-bg: rgba(17, 18, 20, 0.58);
      --meter-sub-border: #272A31;
      --track-bg: #121418;
      --track-border: #2B2F38;
      --zone-bg: linear-gradient(180deg, rgba(255, 122, 47, 0.45), rgba(255, 122, 47, 0.16));
      --zone-border: rgba(255, 148, 87, 0.7);
      --pin-color: #FFFFFF;
      --pin-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 0 8px rgba(255, 255, 255, 0.65);
      --toast-bg: rgba(32, 35, 41, 0.96);
      --toast-text: #FFFFFF;
    }

    /* 暖棕经典（原仓库暖棕琥珀配色） */
    html[data-theme="warm"] {
      --bg: #12100E;
      --header-bg: rgba(18, 16, 14, 0.92);
      --tab-bg: rgba(24, 21, 18, 0.94);
      --surface: #1B1815;
      --surface-2: #242019;
      --input-bg: #15120F;
      --border: #302B24;
      --border-2: #3D352B;
      --text: #F3EEE5;
      --text-2: #E6D7B8;
      --text-sub: #A29889;
      --text-dim: #7D7466;
      --amber: #FFB347;
      --amber-light: #FFB347;
      --amber-ink: #1A1206;
      --amber-bg: rgba(255, 179, 71, 0.16);
      --amber-border: rgba(255, 179, 71, 0.38);
      --green: #4ADE80;
      --green-bg: rgba(74, 222, 128, 0.14);
      --green-border: rgba(74, 222, 128, 0.32);
      --warn: #FFB347;
      --warn-text: #F6CA83;
      --warn-bg: rgba(255, 179, 71, 0.13);
      --warn-border: rgba(255, 179, 71, 0.35);
      --danger: #FF7A5C;
      --danger-bg: rgba(255, 122, 92, 0.14);
      --meter-bg: linear-gradient(175deg, #241D13 0%, #1A1713 70%);
      --meter-border: #3B2F1C;
      --meter-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
      --meter-value: #FFB347;
      --meter-sub-bg: rgba(18, 16, 14, 0.56);
      --meter-sub-border: #332B20;
      --track-bg: #221D17;
      --track-border: #332C24;
      --zone-bg: linear-gradient(180deg, rgba(255, 179, 71, 0.52), rgba(255, 179, 71, 0.2));
      --zone-border: rgba(255, 179, 71, 0.62);
      --pin-color: #FFFFFF;
      --pin-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 0 9px rgba(255, 255, 255, 0.55);
      --toast-bg: rgba(36, 32, 25, 0.96);
      --toast-text: #F3EEE5;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }

    .app-shell {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(82px + env(safe-area-inset-bottom));
    }

    .page-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--header-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      margin-top: calc(-1 * env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .page-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .page-sub-badge {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-sub);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .theme-btn {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .container {
      padding: 14px 14px 18px;
    }

    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: var(--text-sub);
      text-transform: uppercase;
    }

    .param-current {
      font-size: 13px;
      font-weight: 600;
      color: var(--amber-light);
    }

    .param-hint {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .flash-pill {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 13px;
      cursor: pointer;
    }

    .flash-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
      margin-right: 8px;
      flex-shrink: 0;
    }

    .flash-pill-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
    }

    .flash-pill-gn {
      font-size: 12px;
      color: var(--text-sub);
      flex-shrink: 0;
    }

    .flash-pill-arrow {
      margin-left: auto;
      padding-left: 8px;
      font-size: 12px;
      color: var(--amber-light);
      flex-shrink: 0;
    }

    .unit-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Mode Switch */
    .mode-switch {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 4px;
      margin-bottom: 12px;
    }

    .mode-item {
      text-align: center;
      padding: 9px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-sub);
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }

    .mode-item.active {
      background: var(--amber);
      color: var(--amber-ink);
    }

    /* Meter Screen */
    .meter-screen {
      background: var(--meter-bg);
      border: 1px solid var(--meter-border);
      border-radius: 16px;
      padding: 18px 16px 15px;
      margin-bottom: 12px;
      box-shadow: var(--meter-shadow);
    }

    .meter-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .meter-label {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .badge {
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-amber {
      background: var(--amber-bg);
      color: var(--amber-light);
      border: 1px solid var(--amber-border);
    }

    .badge-green {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
    }

    .badge-warn {
      background: var(--warn-bg);
      color: var(--warn);
      border: 1px solid var(--warn-border);
    }

    .meter-main-value {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.08;
      color: var(--meter-value);
      letter-spacing: -1px;
      margin: 4px 0 14px;
    }

    .meter-main-unit {
      font-size: 20px;
      font-weight: 600;
      color: var(--amber-light);
      margin-left: 5px;
      letter-spacing: 0;
    }

    .meter-sub-row {
      display: flex;
      align-items: center;
      background: var(--meter-sub-bg);
      border: 1px solid var(--meter-sub-border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .meter-sub-item {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .meter-sub-key {
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .meter-sub-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
    }

    .meter-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 12px;
    }

    .meter-warning {
      display: flex;
      align-items: flex-start;
      margin-top: 12px;
      padding: 9px 11px;
      border-radius: 9px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
    }

    .warning-icon {
      width: 17px;
      height: 17px;
      line-height: 17px;
      text-align: center;
      border-radius: 50%;
      background: var(--warn);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      margin-right: 8px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .warning-text {
      font-size: 12px;
      color: var(--warn-text);
      line-height: 1.45;
    }

    /* 容差标尺 */
    .ruler-wrap {
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .ruler-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .ruler-title {
      font-size: 11px;
      color: var(--text-sub);
    }

    .ruler-range-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--amber-light);
    }

    .rtrack {
      position: relative;
      height: 28px;
      border-radius: 8px;
      background: var(--track-bg);
      box-shadow: inset 0 0 0 1px var(--track-border);
      overflow: hidden;
    }

    .rzone {
      position: absolute;
      top: 0;
      bottom: 0;
      background: var(--zone-bg);
      border-left: 1px solid var(--zone-border);
      border-right: 1px solid var(--zone-border);
    }

    .rpin {
      position: absolute;
      top: -3px;
      bottom: -3px;
      width: 2px;
      margin-left: -1px;
      background: var(--pin-color);
      border-radius: 1px;
      box-shadow: var(--pin-shadow);
    }

    .rpin.out {
      background: var(--danger);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 8px rgba(255, 122, 122, 0.75);
    }

    .rlabels {
      position: relative;
      height: 15px;
      margin-top: 5px;
    }

    .rlab {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 10px;
      color: var(--text-sub);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .tol-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tol-row::-webkit-scrollbar {
      display: none;
    }

    .tol-chip {
      flex: 1;
      text-align: center;
      padding: 5px 6px;
      border-radius: 7px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .tol-chip.active {
      background: var(--amber-bg);
      border-color: var(--amber);
      color: var(--amber-light);
      font-weight: 600;
    }

    /* Controls */
    .param-block {
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .param-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .chip-scroll {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .chip-scroll::-webkit-scrollbar {
      display: none;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 13px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
    }

    .chip.active {
      background: var(--amber-bg);
      border-color: var(--amber);
      color: var(--amber-light);
      font-weight: 700;
    }

    .power-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .power-chip {
      text-align: center;
      padding: 9px 0;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .power-chip.active {
      background: var(--amber-bg);
      border-color: var(--amber);
      color: var(--amber-light);
    }

    .power-chip.disabled {
      opacity: 0.35;
    }

    .stepper-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-btn {
      width: 50px;
      height: 40px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .step-btn:active, .mini-step-btn:active, .chip:active, .power-chip:active {
      transform: scale(0.97);
    }

    .step-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      text-align: center;
      background: var(--input-bg);
      border: 1px solid var(--border-2);
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      outline: none;
    }

    .step-input:focus {
      border-color: var(--amber);
    }

    .quick-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .mini-chip {
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-sub);
      cursor: pointer;
    }

    .mini-chip.active {
      border-color: var(--amber);
      color: var(--amber-light);
      background: var(--amber-bg);
    }

    .sub-label {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .bias-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      gap: 10px;
    }

    .bias-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
    }

    .bias-desc {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .bias-stepper {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .mini-step-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .bias-val {
      min-width: 58px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--amber-light);
    }

    .sync-tip {
      padding: 11px 13px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px dashed var(--border);
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.55;
    }

    .sync-tip strong {
      color: var(--text-2);
    }

    /* Chart Table */
    .summary-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .summary-meta {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    .table-card {
      padding: 10px 14px;
    }

    .table-head {
      display: flex;
      align-items: center;
      padding: 6px 4px 10px;

<body>
  <div class="app-shell">
    <header class="page-header">
      <div class="page-title" id="headerTitle">胶片闪光测光表</div>

    <main class="container">
      <!-- 页面 1：计算器 -->

      <!-- 页面 2：速查表 -->

    </main>

    <nav class="tab-bar">
      <div class="tab-bar-inner">
        <button class="tab-btn active" data-tab="calc" type="button">
          <svg viewBox="0 0 24 24"><polygon points="13 2 4 14 12 14 11 22 20 10 12 10 13 2"></polygon></svg>
          <span>计算</span>
        </button>
        <button class="tab-btn" data-tab="chart" type="button">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="10" y1="4" x2="10" y2="20"></line></svg>
          <span>速查表</span>
        </button>
        <button class="tab-btn" data-tab="gear" type="button">
          <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          <span>灯库设置</span>
        </button>
      </div>
    </nav>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      /* ============================================================
         CORE:BEGIN  —— 纯计算，无 DOM。test/core.test.mjs 会原样抽取这一段。
         ============================================================ */
      const METERS_TO_FEET = 3.280839895;
      const ISO_OPTIONS = [25, 50, 64, 100, 125, 160, 200, 250, 320, 400, 500, 800, 1600, 3200];
      const POWER_LEVELS = [
        { label: '1/1', ratio: 1 },
        { label: '1/2', ratio: 1 / 2 },
        { label: '1/4', ratio: 1 / 4 },
        { label: '1/8', ratio: 1 / 8 },
        { label: '1/16', ratio: 1 / 16 },
        { label: '1/32', ratio: 1 / 32 },
        { label: '1/64', ratio: 1 / 64 },
        { label: '1/128', ratio: 1 / 128 },
      ];
      const MODIFIER_PRESETS = [
        { id: 'direct', name: '直闪', lossEv: 0 },
        { id: 'diffuser', name: '柔光罩', lossEv: 1.0 },
        { id: 'card', name: '反光板', lossEv: 1.5 },
        { id: 'bounce', name: '低顶跳闪', lossEv: 2.0 },
        { id: 'high_bounce', name: '高顶跳闪', lossEv: 3.0 },
      ];
      const TOLERANCE_PRESETS = [
        { id: 'neg', label: '负片 +2/−1', over: 2, under: 1 },
        { id: 'slide', label: '反转 ±0.5', over: 0.5, under: 0.5 },
        { id: 'digi', label: '数码 ±1/3', over: 1 / 3, under: 1 / 3 },
        { id: 'strict', label: '严格 0', over: 0, under: 0 },
      ];

      const FULL_STOPS = ['1.0', '1.4', '2', '2.8', '4', '5.6', '8', '11', '16', '22', '32'].map((s, idx) => ({
        label: 'f/' + s,
        value: Math.pow(2, idx / 2),
      }));
      const HALF_STOPS = [
        '1.0', '1.2', '1.4', '1.7', '2', '2.4', '2.8', '3.4',
        '4', '4.8', '5.6', '6.7', '8', '9.5', '11', '13',
        '16', '19', '22', '27', '32',
      ].map((s, idx) => ({ label: 'f/' + s, value: Math.pow(2, idx / 4) }));
      const THIRD_STOPS = [
        '1.0', '1.1', '1.2', '1.4', '1.6', '1.8', '2', '2.2', '2.5',
        '2.8', '3.2', '3.5', '4', '4.5', '5.0', '5.6', '6.3', '7.1',
        '8', '9', '10', '11', '13', '14', '16', '18', '20',
        '22', '25', '29', '32',
      ].map((s, idx) => ({ label: 'f/' + s, value: Math.pow(2, idx / 6) }));

      const DEFAULT_FLASH_PRESETS = [
        { id: 'godox-lux-junior', name: '神牛 Lux Junior', gn100m: 12, minPowerLabel: '1/64', note: '复古便携热靴灯 · 28mm 覆盖视角', builtin: true },
        { id: 'godox-lux-senior', name: '神牛 Lux Senior', gn100m: 14, minPowerLabel: '1/64', note: '折叠反光罩复古灯 · 28mm 覆盖', builtin: true },
        { id: 'godox-im30', name: '神牛 iM30', gn100m: 15, minPowerLabel: '1/64', note: '迷你单触点手动闪光灯', builtin: true },
        { id: 'godox-im20', name: '神牛 iM20 / iM22', gn100m: 10, minPowerLabel: '1/32', note: '超轻便携机顶小闪光灯', builtin: true },
        { id: 'godox-tt350', name: 'Godox TT350 (105mm)', gn100m: 36, minPowerLabel: '1/128', note: '标称条件：105mm 变焦端 · 广角端指数更低', builtin: true },
        { id: 'godox-tt600', name: 'Godox TT600 (105mm)', gn100m: 60, minPowerLabel: '1/128', note: '大功率机顶手动灯 · 105mm 标称', builtin: true },
        { id: 'fuji-ef-x20', name: '富士 EF-X20', gn100m: 20, minPowerLabel: '1/64', note: '经典金属拨盘闪光灯', builtin: true },
        { id: 'yinyan-by24', name: '银燕 BY-24ZP', gn100m: 24, minPowerLabel: '1/1', note: '经典平价全功率老灯（仅 1/1 档）', builtin: true },
        { id: 'nikon-sb24-35', name: '尼康 SB-24 (35mm)', gn100m: 36, minPowerLabel: '1/16', note: '胶片时代主力灯 · 35mm 焦距端标称', builtin: true },
        { id: 'nikon-sb800-35', name: 'Nikon SB-800 (35mm)', gn100m: 38, minPowerLabel: '1/128', note: '经典热靴灯 · 35mm 焦距端标称', builtin: true },
        { id: 'canon-580ex-50', name: '佳能 580EX II (50mm)', gn100m: 42, minPowerLabel: '1/128', note: '大功率机顶灯 · 50mm 焦距端标称', builtin: true },
        { id: 'vivitar-285hv', name: 'Vivitar 285HV (35mm)', gn100m: 37, minPowerLabel: '1/16', note: '经典手动复古灯 · 35mm 焦距端标称', builtin: true },
      ];

      const CHART_DISTANCES_M = [0.7, 1.0, 1.2, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0, 7.0, 10.0];

      function getApertureStops(stepMode) {
        if (stepMode === 'full') return FULL_STOPS;
        if (stepMode === 'half') return HALF_STOPS;
        return THIRD_STOPS;
      }

      function getPowerByLabel(label) {
        return POWER_LEVELS.find((p) => p.label === label) || POWER_LEVELS[0];
      }

      function getAvailablePowers(minPowerLabel) {
        const idx = POWER_LEVELS.findIndex((p) => p.label === minPowerLabel);
        return idx === -1 ? POWER_LEVELS : POWER_LEVELS.slice(0, idx + 1);
      }

      function getToleranceById(id) {
        return TOLERANCE_PRESETS.find((t) => t.id === id) || TOLERANCE_PRESETS[0];
      }

      function metersToUnit(m, unit) {
        return unit === 'ft' ? m * METERS_TO_FEET : m;
      }

      function unitToMeters(v, unit) {
        return unit === 'ft' ? v / METERS_TO_FEET : v;
      }

      function fmt(num, decimals = 1) {
        if (!Number.isFinite(num)) return '--';
        return Number(num.toFixed(decimals)).toString();
      }

      function fmtEvDelta(evDelta) {
        if (!Number.isFinite(evDelta)) return '0 EV';
        const rounded = Math.round(evDelta * 10) / 10;
        if (Math.abs(rounded) < 0.05) return '准确 (0 EV)';
        const sign = rounded > 0 ? '+' : '';
        return `${sign}${rounded.toFixed(1)} EV (${rounded > 0 ? '略过曝' : '略欠曝'})`;
      }

      function calcEffectiveGnMeters({ gn100m, iso = 100, powerRatio = 1, modifierLossEv = 0, exposureBiasEv = 0 }) {
        const safeGn = Math.max(0.1, Number(gn100m) || 12);
        const safeIso = Math.max(1, Number(iso) || 100);
        const safePower = Math.max(1 / 256, Number(powerRatio) || 1);
        const totalEv = (Number(modifierLossEv) || 0) + (Number(exposureBiasEv) || 0);
        const isoFactor = Math.sqrt(safeIso / 100);
        const powerFactor = Math.sqrt(safePower);
        const evFactor = Math.pow(2, -totalEv / 2);
        return {
          effectiveGnMeters: safeGn * isoFactor * powerFactor * evFactor,
          maxAchievableGnMeters: safeGn * isoFactor * evFactor,
        };
      }

      function findNearestAperture(exactAperture, stepMode = 'third') {
        const stops = getApertureStops(stepMode);
        let best = stops[0];
        let bestAbs = Infinity;
        let bestDelta = 0;
        for (const stop of stops) {
          const evDelta = 2 * Math.log2(exactAperture / stop.value);
          const abs = Math.abs(evDelta);
          if (abs < bestAbs) {
            bestAbs = abs;
            bestDelta = evDelta;
            best = stop;
          }
        }
        return { stop: best, evDelta: bestDelta };
      }

      function calcApertureBand(exactAperture, tol) {
        return {
          min: exactAperture / Math.pow(2, tol.over / 2),
          max: exactAperture * Math.pow(2, tol.under / 2),
        };
      }

      function calcDistanceBand(exactDistance, tol) {
        return {
          min: exactDistance / Math.pow(2, tol.over / 2),
          max: exactDistance * Math.pow(2, tol.under / 2),
        };
      }

      function solveApertureState(st) {
        const power = getPowerByLabel(st.powerLabel);
        const safeDist = Math.max(0.1, Number(st.distanceMeters) || 1);
        const { effectiveGnMeters } = calcEffectiveGnMeters({
          gn100m: st.gn100m,
          iso: st.iso,
          powerRatio: power.ratio,
          modifierLossEv: st.modifierLossEv,
          exposureBiasEv: st.exposureBiasEv,
        });
        const exactAperture = effectiveGnMeters / safeDist;
        const nearest = findNearestAperture(exactAperture, st.stepMode);
        const tol = getToleranceById(st.toleranceId);
        const band = calcApertureBand(exactAperture, tol);
        let warning = '';
        if (exactAperture < 1.0) {
          warning = '所需光圈大于 f/1.0，严重欠曝。建议提高输出功率、改用高感光度胶卷或拉近拍摄距离。';
        } else if (exactAperture < 1.4) {
          warning = '所需光圈较大（超出常见标头最大光圈），若镜头不支持请调高功率或靠近主体。';
        } else if (exactAperture > 22) {
          warning = '所需光圈极小（超过 f/22），若镜头无此小光圈请降低闪光灯功率或退后拍摄。';
        }
        return { exactAperture, nearest, band, effectiveGnMeters, warning };
      }

      function solveDistanceState(st) {
        const power = getPowerByLabel(st.powerLabel);
        const tol = getToleranceById(st.toleranceId);
        const safeAperture = Math.max(0.7, Number(st.apertureValue) || 4);
        const { effectiveGnMeters } = calcEffectiveGnMeters({
          gn100m: st.gn100m,
          iso: st.iso,
          powerRatio: power.ratio,
          modifierLossEv: st.modifierLossEv,
          exposureBiasEv: st.exposureBiasEv,
        });
        const exactDistanceMeters = effectiveGnMeters / safeAperture;
        const bandMeters = calcDistanceBand(exactDistanceMeters, tol);
        let warning = '';
        if (exactDistanceMeters < 0.5) {
          warning = '有效距离过近（小于 0.5m），机顶闪光灯可能因视差或遮挡导致布光不均，建议调低功率或缩小光圈。';
        } else if (exactDistanceMeters > 15) {
          warning = '计算距离超过 15m，实际户外环境中闪光灯衰减与环境杂光影响较大。';
        }
        return {
          exactDistanceMeters,
          exactInUnit: metersToUnit(exactDistanceMeters, st.unit),
          minSafeInUnit: metersToUnit(bandMeters.min, st.unit),
          maxSafeInUnit: metersToUnit(bandMeters.max, st.unit),
          effectiveGnMeters,
          warning,
        };
      }

      function solvePowerState(st) {
        const safeDist = Math.max(0.1, Number(st.distanceMeters) || 1);
        const safeAperture = Math.max(0.7, Number(st.apertureValue) || 4);
        const tol = getToleranceById(st.toleranceId);
        const { maxAchievableGnMeters } = calcEffectiveGnMeters({
          gn100m: st.gn100m,
          iso: st.iso,
          powerRatio: 1,
          modifierLossEv: st.modifierLossEv,
          exposureBiasEv: st.exposureBiasEv,
        });
        const exactPowerRatio = Math.pow((safeDist * safeAperture) / maxAchievableGnMeters, 2);
        const available = getAvailablePowers(st.minPowerLabel);
        let best = available[0];
        let bestAbs = Infinity;
        let bestDelta = 0;
        for (const item of available) {
          const evDelta = Math.log2(item.ratio / exactPowerRatio);
          const abs = Math.abs(evDelta);
          if (abs < bestAbs) {
            bestAbs = abs;
            bestDelta = evDelta;
            best = item;
          }
        }
        const minPower = available[available.length - 1];
        const dRecMeters = (maxAchievableGnMeters * Math.sqrt(best.ratio)) / safeAperture;
        const bandMeters = calcDistanceBand(dRecMeters, tol);
        let warning = '';
        if (exactPowerRatio > 1.0) {
          warning = `全光 (1/1) 仍欠曝约 ${Math.log2(exactPowerRatio).toFixed(1)} EV，请开大光圈、拉近距离或换更高 ISO 胶卷。`;
        } else if (exactPowerRatio < minPower.ratio) {
          warning = `低于当前灯最低功率 (${minPower.label})，将过曝约 ${Math.log2(minPower.ratio / exactPowerRatio).toFixed(1)} EV，建议缩小光圈或加柔光罩/退后。`;
        }
        return {
          exactPowerRatio,
          exactFractionText: exactPowerRatio >= 1 ? `${exactPowerRatio.toFixed(1)}×` : `1/${Math.round(1 / exactPowerRatio)}`,
          recommendedPower: best,
          evDelta: bestDelta,
          maxAchievableGnMeters,
          safeAperture,
          dRecInUnit: metersToUnit(dRecMeters, st.unit),
          bandMinInUnit: metersToUnit(bandMeters.min, st.unit),
          bandMaxInUnit: metersToUnit(bandMeters.max, st.unit),
          warning,
        };
      }
      /* ============================================================
         CORE:END
         ============================================================ */

      const QUICK_DISTANCES_M = [0.8, 1.2, 1.5, 2.0, 3.0, 5.0];
      const QUICK_DISTANCES_FT = [3, 4, 5, 6, 10, 15];
      const THEMES = [
        { id: 'light', label: '普通', metaColor: '#F4F2ED' },
        { id: 'dark', label: '暗色', metaColor: '#111214' },
        { id: 'warm', label: '暖棕', metaColor: '#12100E' },
      ];

      const SETTINGS_KEY = 'film_flash_html_settings_v1';
      const CUSTOM_FLASHES_KEY = 'film_flash_html_custom_v1';

      const DEFAULT_SETTINGS = {
        mode: 'aperture',
        activeFlashId: 'godox-lux-junior',
        flashName: '神牛 Lux Junior',
        gn100m: 12,
        minPowerLabel: '1/64',
        iso: 400,
        powerLabel: '1/4',
        distanceMeters: 2.0,
        apertureValue: 4.0,
        apertureLabel: 'f/4',
        modifierId: 'direct',
        modifierLossEv: 0,
        exposureBiasEv: 0,
        toleranceId: 'neg',
        theme: 'light',
        unit: 'm',
        stepMode: 'third',
      };

      let activeTab = 'calc';
      let settings = loadSettings();
      let customFlashes = loadCustomFlashes();
      let toastTimer = null;

      function loadSettings() {
        try {
          const raw = localStorage.getItem(SETTINGS_KEY);
          if (raw) {
            const parsed = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw));
            if (!THEMES.some((t) => t.id === parsed.theme)) parsed.theme = 'light';
            return parsed;
          }
        } catch (e) {}
        return Object.assign({}, DEFAULT_SETTINGS);
      }

      function saveSettings(patch) {
        settings = Object.assign({}, settings, patch);
        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        } catch (e) {}
      }

      function loadCustomFlashes() {
        try {
          const raw = localStorage.getItem(CUSTOM_FLASHES_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return [];
      }

      function saveCustomFlashes(list) {
        customFlashes = list;
        try {
          localStorage.setItem(CUSTOM_FLASHES_KEY, JSON.stringify(list));
        } catch (e) {}
      }

      function getAllFlashes() {
        return [...customFlashes, ...DEFAULT_FLASH_PRESETS];
      }

      function applyTheme() {
        const themeObj = THEMES.find((t) => t.id === settings.theme) || THEMES[0];
        document.documentElement.setAttribute('data-theme', themeObj.id);
        const meta = document.getElementById('metaThemeColor');
        if (meta) meta.setAttribute('content', themeObj.metaColor);
        const btn = document.getElementById('btnCycleTheme');
        if (btn) btn.textContent = themeObj.label;
      }

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
      }

      function esc(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function scalePct(v, lo, hi) {
        if (hi <= lo || v <= 0 || lo <= 0) return 50;
        const t = Math.log(v / lo) / Math.log(hi / lo);
        return Math.max(4, Math.min(96, t * 100));
      }

      function buildToleranceRuler({ title, rangeText, band, mark, fmtLabel }) {
        const tol = getToleranceById(settings.toleranceId);
        const viewLo = Math.min(band.min, mark) / 1.35;
        const viewHi = Math.max(band.max, mark) * 1.35;
        const a = scalePct(band.min, viewLo, viewHi);
        const b = scalePct(band.max, viewLo, viewHi);
        const m = scalePct(mark, viewLo, viewHi);
        const outOfBand = mark < band.min * 0.995 || mark > band.max * 1.005;

        let zoneStyle = `left:${a}%;right:${100 - b}%;`;
        if (b - a < 0.8) {
          zoneStyle = `left:calc(${a}% - 1px);width:2px;`;
        }

        let labelsHtml = '';
        if (tol.over === 0 && tol.under === 0) {
          labelsHtml = `<span class="rlab" style="left:${m}%">${fmtLabel(mark)}</span>`;
        } else if (b - a < 18) {
          labelsHtml = `<span class="rlab" style="left:${(a + b) / 2}%">${fmtLabel(band.min)} – ${fmtLabel(band.max)}</span>`;
        } else {
          labelsHtml = `<span class="rlab" style="left:${a}%">${fmtLabel(band.min)}</span>` +
                       `<span class="rlab" style="left:${b}%">${fmtLabel(band.max)}</span>`;
        }

        return `
          <div class="ruler-wrap">
            <div class="ruler-head">
              <span class="ruler-title">${title}</span>
              <span class="ruler-range-text mono">${rangeText}</span>
            </div>
            <div class="rtrack">
              <div class="rzone" style="${zoneStyle}"></div>
              <div class="rpin ${outOfBand ? 'out' : ''}" style="left:${m}%"></div>
            </div>
            <div class="rlabels">${labelsHtml}</div>
            <div class="tol-row">
              ${TOLERANCE_PRESETS.map((item) => `<div class="tol-chip ${tol.id === item.id ? 'active' : ''}" data-tol-id="${item.id}">${item.label}</div>`).join('')}
            </div>
          </div>
        `;
      }

      function renderHeader() {
        applyTheme();
        const titles = { calc: '胶片闪光测光表', chart: '距离光圈速查表', gear: '灯库与偏好设置' };
        document.getElementById('headerTitle').textContent = titles[activeTab];
        document.getElementById('headerBadge').textContent = `ISO ${settings.iso} · ${settings.unit.toUpperCase()}`;
      }

      function renderCalc() {
        const unit = settings.unit;
        const tol = getToleranceById(settings.toleranceId);
        const gnInUnit = fmt(metersToUnit(settings.gn100m, unit), 1);
        const distInUnit = fmt(metersToUnit(settings.distanceMeters, unit), 1);
        const minIdx = POWER_LEVELS.findIndex((p) => p.label === settings.minPowerLabel);
        const fmtAp = (f) => 'f/' + (f < 10 ? fmt(f, 1) : String(Math.round(f)));
        const fmtDistLabel = (d) => `${fmt(d, d < 10 ? 1 : 0)} ${unit}`;

        let title = '', mainVal = '', mainUnit = '', badgeClass = 'badge-green', badgeText = '', subKey = '', subVal = '', warning = '', effGn = 0, rulerHtml = '';
        if (settings.mode === 'aperture') {
          const res = solveApertureState(settings);
          title = '建议镜头光圈';
          mainVal = res.nearest.stop.label;
          badgeText = fmtEvDelta(res.nearest.evDelta);
          badgeClass = Math.abs(res.nearest.evDelta) < 0.15 ? 'badge-green' : 'badge-amber';
          subKey = '理论精确值';
          subVal = `f/${res.exactAperture.toFixed(1)}`;
          warning = res.warning;
          effGn = res.effectiveGnMeters;
          rulerHtml = buildToleranceRuler({
            title: '可用光圈容差',
            rangeText: tol.over === 0 && tol.under === 0 ? fmtAp(res.exactAperture) : `${fmtAp(res.band.min)} – ${fmtAp(res.band.max)}`,
            band: res.band,
            mark: res.nearest.stop.value,
            fmtLabel: fmtAp,
          });
        } else if (settings.mode === 'distance') {
          const res = solveDistanceState(settings);
          title = '最佳拍摄距离';
          mainVal = fmt(res.exactInUnit, 2);
          mainUnit = unit;
          badgeText = `${settings.apertureLabel} · ${settings.powerLabel}`;
          badgeClass = 'badge-amber';
          subKey = `可用范围 (${tol.label})`;
          subVal = tol.over === 0 && tol.under === 0
            ? `${fmt(res.exactInUnit, 1)} ${unit}`

          rulerHtml = buildToleranceRuler({

        if (warning) badgeClass = 'badge-warn';

        const effGnDisplay = fmt(metersToUnit(effGn, unit), 1);

        const quickDists = (unit === 'ft' ? QUICK_DISTANCES_FT : QUICK_DISTANCES_M).map((v) => {

        const apertureStops = getApertureStops(settings.stepMode);

        document.getElementById('view-calc').innerHTML = `

          </div>

                <span class="meter-sub-key">当前有效 GN</span>
                <span class="meter-sub-val mono">${effGnDisplay} ${unit}</span>
              </div>
            </div>
            ${rulerHtml}
            ${warning ? `<div class="meter-warning"><span class="warning-icon">!</span><span class="warning-text">${esc(warning)}</span></div>` : ''}
          </div>

          <div class="card">
            <div class="param-block">
              <div class="section-header">
                <span class="section-title">胶卷感光度 ISO</span>
                <span class="param-current mono">ISO ${settings.iso}</span>
              </div>
              <div class="chip-scroll">
                ${ISO_OPTIONS.map((iso) => `<div class="chip mono ${settings.iso === iso ? 'active' : ''}" data-iso="${iso}">${iso}</div>`).join('')}
              </div>
            </div>

            <div class="param-block">

              <div class="stepper-row">
                <button class="step-btn" type="button" data-gn-step="-5">-5</button>
                <button class="step-btn" type="button" data-gn-step="-1">-1</button>

                <button class="step-btn" type="button" data-gn-step="1">+1</button>
                <button class="step-btn" type="button" data-gn-step="5">+5</button>
              </div>
            </div>

            ${settings.mode !== 'power' ? `
              <div class="param-block">
                <div class="section-header">
                  <span class="section-title">输出功率挡位</span>
                  <span class="param-current mono">${settings.powerLabel}</span>
                </div>
                <div class="power-grid">
                  ${POWER_LEVELS.map((p, idx) => {
                    const disabled = minIdx !== -1 && idx > minIdx;
                    return `<div class="power-chip mono ${settings.powerLabel === p.label ? 'active' : ''} ${disabled ? 'disabled' : ''}" data-power="${p.label}" data-disabled="${disabled ? '1' : '0'}">${p.label}</div>`;
                  }).join('')}
                </div>
              </div>
            ` : ''}

            ${settings.mode !== 'distance' ? `
              <div class="param-block">
                <div class="section-header">
                  <span class="section-title">主体距离 (${unit})</span>
                  <span class="param-current mono">${distInUnit} ${unit}</span>
                </div>
                <div class="stepper-row">
                  <button class="step-btn" type="button" data-dist-step="-0.5">-0.5</button>
                  <button class="step-btn" type="button" data-dist-step="-0.1">-0.1</button>
                  <input class="step-input mono" id="inputDist" type="number" step="0.1" inputmode="decimal" value="${distInUnit}" />
                  <button class="step-btn" type="button" data-dist-step="0.1">+0.1</button>

              <span class="param-hint">点击切换</span>
            </div>
            ${flashes.map((item) => `
              <div class="flash-item ${settings.activeFlashId === item.id ? 'active' : ''}" data-flash-id="${esc(item.id)}">
                <div class="flash-item-main">
                  <div class="flash-item-top">
                    <span class="flash-item-name">${esc(item.name)}</span>
                    ${settings.activeFlashId === item.id ? '<span class="badge badge-amber">当前使用</span>' : (!item.builtin ? '<span class="custom-tag">自定义</span>' : '')}
                  </div>
                  <div class="flash-item-note">${esc(item.note)}</div>
                  <div class="flash-item-specs mono">GN ${fmt(metersToUnit(item.gn100m, unit), 1)}${unit} (ISO 100) · 最低 ${item.minPowerLabel}</div>
                </div>
                ${!item.builtin ? `<button class="del-btn" type="button" data-del-flash="${esc(item.id)}">删除</button>` : ''}
              </div>
            `).join('')}
          </div>
        `;
      }

      function renderAll() {
        renderHeader();
        if (activeTab === 'calc') renderCalc();
        else if (activeTab === 'chart') renderChart();
        else renderGear();
      }

      function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.view-panel').forEach((el) => el.classList.remove('active'));
        document.getElementById(`view-${tab}`).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        renderAll();
      }

      function applyFlashSelection(target) {
        const minIdx = POWER_LEVELS.findIndex((p) => p.label === target.minPowerLabel);
        const curIdx = POWER_LEVELS.findIndex((p) => p.label === settings.powerLabel);
        const nextPowerLabel = minIdx !== -1 && curIdx > minIdx ? target.minPowerLabel : settings.powerLabel;
        saveSettings({
          activeFlashId: target.id,
          flashName: target.name,
          gn100m: target.gn100m,
          minPowerLabel: target.minPowerLabel,
          powerLabel: nextPowerLabel,
        });
      }

      // 顶部快捷切换主题（普通 -> 暗色 -> 暖棕）
      document.getElementById('btnCycleTheme').addEventListener('click', () => {
        const idx = THEMES.findIndex((t) => t.id === settings.theme);
        const next = THEMES[(idx + 1) % THEMES.length];
        saveSettings({ theme: next.id });
        renderAll();
        showToast(`已切换到${next.label}模式`);
      });

      document.querySelector('.tab-bar').addEventListener('click', (e) => {
        const btn = e.target.closest('.tab-btn');
        if (btn) switchTab(btn.dataset.tab);
      });

      document.getElementById('view-calc').addEventListener('click', (e) => {
        const t = e.target;
        if (t.closest('#btnGoGear')) {
          switchTab('gear');
          return;
        }
        if (t.closest('#btnToggleUnit')) {
          saveSettings({ unit: settings.unit === 'm' ? 'ft' : 'm' });
          renderAll();
          return;
        }
        const modeEl = t.closest('[data-mode]');
        if (modeEl) {
          saveSettings({ mode: modeEl.dataset.mode });
          renderAll();
          return;
        }
        const isoEl = t.closest('[data-iso]');
        if (isoEl) {
          saveSettings({ iso: Number(isoEl.dataset.iso) });
          renderAll();
          return;
        }
        const gnStepEl = t.closest('[data-gn-step]');
        if (gnStepEl) {
          const delta = Number(gnStepEl.dataset.gnStep);
          const cur = metersToUnit(settings.gn100m, settings.unit);
          const next = Math.max(1, Math.min(250, Math.round((cur + delta) * 10) / 10));
          saveSettings({ gn100m: unitToMeters(next, settings.unit), flashName: '自定义 GN', activeFlashId: 'custom-inline' });
          renderAll();
          return;
        }
        const powerEl = t.closest('[data-power]');
        if (powerEl) {
          if (powerEl.dataset.disabled === '1') {
            showToast(`当前灯最低支持 ${settings.minPowerLabel}`);
            return;
          }
          saveSettings({ powerLabel: powerEl.dataset.power });
          renderAll();
          return;
        }
        const distStepEl = t.closest('[data-dist-step]');
        if (distStepEl) {
          const delta = Number(distStepEl.dataset.distStep);
          const unit = settings.unit;
          const cur = metersToUnit(settings.distanceMeters, unit);
          const minV = unit === 'ft' ? 1.0 : 0.3;
          const maxV = unit === 'ft' ? 100 : 30;
          const next = Math.max(minV, Math.min(maxV, Math.round((cur + delta) * 10) / 10));
          saveSettings({ distanceMeters: unitToMeters(next, unit) });
          renderAll();
          return;
        }
        const quickDistEl = t.closest('[data-quick-dist]');
        if (quickDistEl) {
          saveSettings({ distanceMeters: Number(quickDistEl.dataset.quickDist) });
          renderAll();
          return;
        }
        const apEl = t.closest('[data-ap-label]');
        if (apEl) {
          saveSettings({ apertureLabel: apEl.dataset.apLabel, apertureValue: Number(apEl.dataset.apVal) });
          renderAll();
          return;
        }
        const modEl = t.closest('[data-mod-id]');
        if (modEl) {
          saveSettings({ modifierId: modEl.dataset.modId, modifierLossEv: Number(modEl.dataset.modLoss) });
          renderAll();
          return;
        }
        const tolEl = t.closest('[data-tol-id]');
        if (tolEl) {
          saveSettings({ toleranceId: tolEl.dataset.tolId });
          renderAll();
          return;
        }
        const biasEl = t.closest('[data-bias-step]');
        if (biasEl) {
          const delta = Number(biasEl.dataset.biasStep);
          const next = Math.max(-2.0, Math.min(2.5, Math.round(((Number(settings.exposureBiasEv) || 0) + delta) * 10) / 10));
          saveSettings({ exposureBiasEv: next });
          renderAll();
        }
      });

      document.getElementById('view-calc').addEventListener('change', (e) => {
        if (e.target.id === 'inputGn') {
          const val = parseFloat(e.target.value);
          if (Number.isFinite(val) && val > 0) {
            const clamped = Math.max(1, Math.min(250, val));
            saveSettings({ gn100m: unitToMeters(clamped, settings.unit), flashName: '自定义 GN', activeFlashId: 'custom-inline' });
          }
          renderAll();
        } else if (e.target.id === 'inputDist') {
          const val = parseFloat(e.target.value);
          if (Number.isFinite(val) && val > 0) {
            const minV = settings.unit === 'ft' ? 1.0 : 0.3;
            const maxV = settings.unit === 'ft' ? 100 : 30;
            const clamped = Math.max(minV, Math.min(maxV, val));
            saveSettings({ distanceMeters: unitToMeters(clamped, settings.unit) });
          }
          renderAll();
        }
      });

      document.getElementById('view-chart').addEventListener('click', (e) => {
        const powerEl = e.target.closest('[data-power]');
        if (powerEl) {
          if (powerEl.dataset.disabled === '1') {
            showToast(`当前灯最低支持 ${settings.minPowerLabel}`);
            return;
          }
          saveSettings({ powerLabel: powerEl.dataset.power });
          renderAll();
        }
      });

      document.getElementById('view-gear').addEventListener('click', (e) => {
        const t = e.target;
        const delBtn = t.closest('[data-del-flash]');
        if (delBtn) {
          const delId = delBtn.dataset.delFlash;
          const next = customFlashes.filter((f) => f.id !== delId);
          saveCustomFlashes(next);
          if (settings.activeFlashId === delId) {
            applyFlashSelection(DEFAULT_FLASH_PRESETS[0]);
          }
          showToast('已移除');
          renderAll();
          return;
        }
        const themeBtn = t.closest('[data-theme]');
        if (themeBtn) {
          saveSettings({ theme: themeBtn.dataset.theme });
          renderAll();
          return;
        }
        const unitBtn = t.closest('[data-unit]');
        if (unitBtn) {
          saveSettings({ unit: unitBtn.dataset.unit });
          renderAll();
          return;
        }
        const stepBtn = t.closest('[data-step]');
        if (stepBtn) {
          const stepMode = stepBtn.dataset.step;
          const nearest = findNearestAperture(settings.apertureValue, stepMode);
          saveSettings({ stepMode, apertureLabel: nearest.stop.label, apertureValue: nearest.stop.value });
          renderAll();
          return;
        }
        if (t.id === 'btnAddFlash') {
          const name = (document.getElementById('newFlashName').value || '').trim();
          const gn = parseFloat(document.getElementById('newFlashGn').value);
          const minPowerLabel = document.getElementById('newFlashMinPower').value || '1/64';
          if (!name) {
            showToast('请输入闪光灯名称');
            return;
          }
          if (!Number.isFinite(gn) || gn < 1 || gn > 250) {
            showToast('请输入有效 GN 值 (1~250)');
            return;
          }
          const created = {
            id: `custom-${Date.now()}`,
            name,
            gn100m: gn,
            minPowerLabel,
            note: '用户自定义闪光灯',
            builtin: false,
          };
          saveCustomFlashes([created, ...customFlashes]);
          applyFlashSelection(created);
          showToast('已保存并切换');
          renderAll();
          return;
        }
        const flashItem = t.closest('[data-flash-id]');
        if (flashItem) {
          const target = getAllFlashes().find((f) => f.id === flashItem.dataset.flashId);
          if (target) {
            applyFlashSelection(target);
            switchTab('calc');
          }
        }
      });

      renderAll();

      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
